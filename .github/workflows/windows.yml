name: Compilar NexoDrop para Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'scripts/build-windows.ps1'
      - 'docs/windows-uso.txt'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Flutter 3.44.5 desde su distribución oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Invoke-RestMethod 'https://storage.googleapis.com/flutter_infra_release/flutter/releases/releases_windows.json'
          $release = $manifest.releases | Where-Object { $_.version -eq '3.44.5' -and $_.channel -eq 'stable' -and $_.dart_sdk_arch -eq 'x64' } | Select-Object -First 1
          if (-not $release) { throw 'No se encontró Flutter 3.44.5 x64.' }
          $archive = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          Invoke-WebRequest "$($manifest.base_url)/$($release.archive)" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $release.sha256.ToLowerInvariant()) { throw 'Checksum incorrecto del SDK Flutter.' }
          $sdkDirectory = Join-Path $env:RUNNER_TEMP 'nexodrop-sdk'
          Expand-Archive $archive -DestinationPath $sdkDirectory
          Join-Path $sdkDirectory 'flutter\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compilar y empaquetar
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Guardar paquete Windows y SHA-256
        uses: actions/upload-artifact@v7
        with:
          name: NexoDrop-Windows-x64
          path: |
            dist/NexoDrop-*-Windows-x64.zip
            dist/NexoDrop-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
