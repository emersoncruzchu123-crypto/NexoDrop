name: Compilar NexoDrop para Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'scripts/build-windows.ps1'
      - 'docs/windows-uso.txt'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Flutter 3.44.5 desde su repositorio oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkDirectory = Join-Path $env:RUNNER_TEMP 'nexodrop-flutter'
          git clone --depth 1 --branch 3.44.5 https://github.com/flutter/flutter.git $sdkDirectory
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar Flutter 3.44.5.' }
          $flutterCommand = Join-Path $sdkDirectory 'bin\flutter.bat'
          & $flutterCommand --version
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Flutter.' }
          Join-Path $sdkDirectory 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compilar y empaquetar
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Guardar paquete Windows y SHA-256
        uses: actions/upload-artifact@v7
        with:
          name: NexoDrop-Windows-x64
          path: |
            dist/NexoDrop-*-Windows-x64.zip
            dist/NexoDrop-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
